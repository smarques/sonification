[env:esp32-s3-audio-board]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; This board has 16MB flash and 8MB octal PSRAM (ESP32-S3R8).
; The generic devkitc-1 board definition may not match exactly -
; adjust these if you get boot/PSRAM errors after first flash.
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git
    https://github.com/pschatzmann/arduino-audio-driver.git